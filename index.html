<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bet-Pro Engine</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; border-left: 4px solid #00ffcc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: left; }
        .btn-add { background: #00ffcc; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .sidebar { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BET-PRO ENGINE</h1>
        <div id="status" style="color: #00ffcc;">Caricamento in corso...</div>
        <div class="card">
            <table id="betsTable">
                <thead><tr><th>Sport</th><th>Match</th><th>Pick</th><th>Prob %</th><th>Quota</th><th>EV%</th><th>Azioni</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="sidebar">
            <h3>Schedina</h3>
            <div id="slipItems">Nessuna selezione.</div>
            <p><strong>Totale Quota:</strong> <span id="totalOdds">1.00</span></p>
            <input type="number" id="stake" value="10" oninput="updateCalculation()"> €
            <p><strong>Vincita:</strong> <span id="potentialWin">0.00</span> €</p>
        </div>
    </div>
    <script>
        let allBets = [];
        let selected = [];

        fetch('results.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                document.getElementById('status').innerText = "Ultimo aggiornamento: " + data.last_update;
                allBets = data.recommendations;
                let tbody = document.querySelector("#betsTable tbody");
                allBets.forEach(b => {
                    tbody.innerHTML += `<tr><td>${b.sport}</td><td>${b.match}</td><td>${b.pick}</td><td>${b.probability}%</td><td>${b.odds}</td><td>${b.ev}%</td><td><button class="btn-add" onclick="add('${b.id}')">Aggiungi</button></td></tr>`;
                });
            }).catch(e => document.getElementById('status').innerText = "Errore: " + e.message);

        function add(id) {
            if(!selected.find(x => x.id === id)) selected.push(allBets.find(x => x.id === id));
            renderSlip();
        }

        function renderSlip() {
            document.getElementById('slipItems').innerHTML = selected.map(x => `<div>${x.match} (${x.odds})</div>`).join('');
            updateCalculation();
        }

        function updateCalculation() {
            let total = selected.reduce((acc, b) => acc * b.odds, 1);
            document.getElementById('totalOdds').innerText = total.toFixed(2);
            document.getElementById('potentialWin').innerText = (total * document.getElementById('stake').value).toFixed(2);
        }
    </script>
</body>
</html>
