<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bet-Pro Quant Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; border-left: 4px solid #00ffcc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 15px; border-bottom: 1px solid #333; text-align: left; }
        th { color: #00ffcc; }
        #lastUpdate { color: #00ffcc; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BET-PRO QUANT ENGINE</h1>
        <div id="lastUpdate">Avvio script...</div>
        
        <div class="card">
            <h3>🔥 Analisi Mercati Globali</h3>
            <table id="betsTable">
                <thead>
                    <tr><th>Sport</th><th>Evento</th><th>Pick</th><th>Quota</th><th>EV%</th></tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align:center; color:#888;">In attesa dei dati...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Funzione eseguita subito per verificare che JS funzioni
        const statusBox = document.getElementById('lastUpdate');
        statusBox.innerText = "Stato: Connessione al file JSON in corso...";

        // Proviamo a caricare il file con percorso assoluto/relativo sicuro
        fetch('./results.json?' + new Date().getTime())
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("File non trovato o errore HTTP: " + response.status);
                }
                return response.json();
            })
            .then(function(data) {
                statusBox.innerText = "Ultimo aggiornamento server: " + (data.last_update || "N/D");
                
                const tbody = document.querySelector("#betsTable tbody");
                tbody.innerHTML = ""; 

                if (data.recommendations && data.recommendations.length > 0) {
                    data.recommendations.forEach(function(b) {
                        tbody.innerHTML += `<tr>
                            <td>${b.sport || ''}</td>
                            <td>${b.match || ''}</td>
                            <td>${b.pick || ''}</td>
                            <td style="color:#00ffcc;font-weight:bold;">${b.odds || ''}</td>
                            <td>+${b.ev || 0}%</td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ffcc00;">Nessuna quota disponibile al momento (Mercati vuoti).</td></tr>`;
                }
            })
            .catch(function(error) {
                statusBox.innerText = "ERRORE: " + error.message;
                statusBox.style.color = "#ff4444";
                console.error("Dettaglio errore:", error);
            });
    </script>
</body>
</html>
