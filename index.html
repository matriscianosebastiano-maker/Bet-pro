<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bet-Pro Quant Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; border-left: 4px solid #00ffcc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 15px; border-bottom: 1px solid #333; text-align: left; }
        th { color: #00ffcc; }
        #lastUpdate { color: #888; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BET-PRO QUANT ENGINE</h1>
        <div id="lastUpdate">Caricamento stato...</div>
        
        <div class="card">
            <h3>🔥 Analisi Mercati Globali</h3>
            <table id="betsTable">
                <thead>
                    <tr><th>Sport</th><th>Evento</th><th>Pick</th><th>Quota</th><th>EV%</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Timestamp anti-cache per forzare il caricamento dei dati freschi
        const timestamp = new Date().getTime();
        fetch('results.json?t=' + timestamp)
            .then(res => res.json())
            .then(data => {
                document.getElementById('lastUpdate').innerText = "Ultimo aggiornamento server: " + data.last_update;
                const tbody = document.querySelector("#betsTable tbody");
                tbody.innerHTML = ""; // Pulisce la tabella prima di riempirla
                data.recommendations.forEach(b => {
                    tbody.innerHTML += `<tr>
                        <td>${b.sport}</td>
                        <td>${b.match}</td>
                        <td>${b.pick}</td>
                        <td style="color:#00ffcc;font-weight:bold;">${b.odds}</td>
                        <td>+${b.ev}%</td>
                    </tr>`;
                });
            })
            .catch(err => console.error("Errore nel caricamento dati:", err));
    </script>
</body>
</html>
