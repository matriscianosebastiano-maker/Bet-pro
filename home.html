<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bet-Pro Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; }
        .tag-SICURA { color: #00ff00; font-weight: bold; }
        .tag-VALUE { color: #ffff00; font-weight: bold; }
        .tag-BIG { color: #ff00ff; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th { color: #aaa; text-align: left; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <div style="padding:20px;">
        <h1>Analisi Matematica</h1>
        <table>
            <thead><tr><th>Match</th><th>Pick</th><th>Q</th><th>Conf.</th><th>Insight</th></tr></thead>
            <tbody id="data"></tbody>
        </table>
    </div>
    <script>
        fetch('results.json?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                document.getElementById('data').innerHTML = data.recommendations.map(b => `
                    <tr>
                        <td>${b.match}</td>
                        <td>${b.pick}</td>
                        <td>${b.odds}</td>
                        <td>${b.prob}%</td>
                        <td class="tag-${b.insight}">${b.insight}</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
