<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet-Pro Multi-Sport Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; border-left: 4px solid #00ffcc; margin-bottom: 20px; box-sizing: border-box; }
        .top-card { border-left: 4px solid #ffcc00; background: linear-gradient(135deg, #252216 0%, #1e1e1e 100%); }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 10px; border-bottom: 1px solid #333; text-align: left; font-size: 0.85em; }
        th { color: #00ffcc; background: #181818; }
        .btn-add { background: #00ffcc; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; color: #121212; }
        .btn-add:hover { background: #00b386; }
        .risk-basso { color: #00ff00; font-weight: bold; }
        .risk-medio { color: #ffcc00; font-weight: bold; }
        .risk-alto { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BET-PRO ENGINE</h1>
        <div id="status" style="color: #00ffcc; margin-bottom: 15px; font-size: 0.9em;">Caricamento analisi in corso...</div>
        
        <!-- TOP PICK CONSIGLIATA -->
        <div id="topPickContainer"></div>

        <!-- TABELLA PALINSESTO -->
        <div class="card">
            <h3>📋 Palinsesto e Altre Opportunità</h3>
            <div style="overflow-x: auto;">
                <table id="betsTable">
                    <thead>
                        <tr>
                            <th>Match</th>
                            <th>Pronostico</th>
                            <th>Quota</th>
                            <th>Prob.%</th>
                            <th>Rischio</th>
                            <th>Azione</th>
                        </tr>
                    </thead>
                    <tbody><tr><td colspan="6" style="text-align:center;">Caricamento dati...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- SCHEDINA -->
        <div class="card">
            <h3>🧮 Schedina Selezionata</h3>
            <div id="slipItems" style="margin-bottom: 10px; color: #aaa;">Nessuna selezione.</div>
            <p><strong>Quota Totale:</strong> <span id="totalOdds" style="color:#00ffcc;">1.00</span></p>
            <label>Importo (€): </label>
            <input type="number" id="stake" value="10" oninput="updateCalculation()" style="background:#333; color:#fff; border:1px solid #444; padding:5px; width:80px; border-radius:4px;">
            <p style="margin-top: 10px;"><strong>Vincita Potenziale:</strong> <span id="potentialWin" style="color:#00ffcc; font-size:1.1em; font-weight:bold;">0.00 €</span></p>
        </div>
    </div>

    <script>
        var allBets = [];
        var selected = [];
        var globalTopPick = null;

        fetch('results.json?t=' + Date.now())
            .then(function(r) {
                if (!r.ok) throw new Error("File results.json non trovato.");
                return r.json();
            })
            .then(function(data) {
                document.getElementById('status').innerText = "Ultimo aggiornamento: " + (data.last_update || "N/D");
                globalTopPick = data.top_pick || null;
                
                var topDiv = document.getElementById('topPickContainer');
                if (globalTopPick) {
                    topDiv.innerHTML = '<div class="card top-card">' +
                        '<h3 style="color:#ffcc00; margin-top:0;">🎯 TOP PICK CONSIGLIATA</h3>' +
                        '<p style="font-size: 1.1em; margin: 5px 0;"><strong>' + (globalTopPick.match || '') + '</strong></p>' +
                        '<p style="margin: 5px 0;">Puntata consigliata: <span style="color:#00ffcc; font-weight:bold; font-size:1.1em;">' + (globalTopPick.pick || '') + '</span> a quota <strong style="color:#fff;">' + (globalTopPick.odds || '') + '</strong></p>' +
                        '<p style="font-size: 0.85em; color: #ccc; margin: 5px 0;">Probabilità stimata: ' + (globalTopPick.prob || '') + '% | Valutazione Rischio: ' + (globalTopPick.risk || 'N/D') + '</p>' +
                        '<button class="btn-add" style="margin-top:8px;" onclick="addBet(\'' + (globalTopPick.id || '') + '\')">Aggiungi alla Schedina</button>' +
                    '</div>';
                }

                allBets = data.recommendations || [];
                var tbody = document.querySelector("#betsTable tbody");
                tbody.innerHTML = "";

                if(allBets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ffcc00;">Nessun evento disponibile.</td></tr>';
                    return;
                }

                allBets.forEach(function(b) {
                    var riskText = b.risk || "";
                    var riskClass = "risk-medio";
                    if(riskText.indexOf("Basso") !== -1) riskClass = "risk-basso";
                    if(riskText.indexOf("Alto") !== -1) riskClass = "risk-alto";

                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td><strong>' + (b.match || '') + '</strong><br><span style="font-size:0.75em; color:#888;">' + (b.sport || '') + '</span></td>' +
                                   '<td style="font-weight:bold; color:#00ffcc;">' + (b.pick || '') + '</td>' +
                                   '<td style="font-weight:bold;">' + (b.odds || '') + '</td>' +
                                   '<td>' + (b.prob || '') + '%</td>' +
                                   '<td><span class="' + riskClass + '">' + riskText + '</span></td>' +
                                   '<td><button class="btn-add" onclick="addBet(\'' + (b.id || '') + '\')">+</button></td>';
                    tbody.appendChild(tr);
                });
            })
            .catch(function(err) {
                document.getElementById('status').innerText = "ERRORE: " + err.message;
                document.getElementById('status').style.color = "#ff4444";
                document.querySelector("#betsTable tbody").innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ff4444;">Impossibile caricare i dati.</td></tr>';
            });

        window.addBet = function(id) {
            var bet = null;
            if (globalTopPick && globalTopPick.id === id) {
                bet = globalTopPick;
            } else {
                bet = allBets.find(function(x) { return x.id === id; });
            }

            if (bet && !selected.some(function(x) { return x.id === id; })) {
                selected.push(bet);
                renderSlip();
            }
        };

        function renderSlip() {
            var slipDiv = document.getElementById('slipItems');
            if (selected.length === 0) {
                slipDiv.innerHTML = "Nessuna selezione.";
                updateCalculation();
                return;
            }
            slipDiv.innerHTML = selected.map(function(x) {
                return '<div style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; background:#2a2a2a; padding:6px; border-radius:4px;">' +
                       '<div><strong>' + (x.match || '') + '</strong><br><span style="color:#00ffcc;">' + (x.pick || '') + '</span> (Quota: ' + (x.odds || '') + ')</div>' +
                       '<button onclick="removeBet(\'' + (x.id || '') + '\')" style="background:#ff4444; color:#fff; border:none; padding:2px 6px; border-radius:3px; cursor:pointer;">X</button>' +
                       '</div>';
            }).join('');
            updateCalculation();
        }

        window.removeBet = function(id) {
            selected = selected.filter(function(x) { return x.id !== id; });
            renderSlip();
        };

        function updateCalculation() {
            var total = selected.reduce(function(acc, b) { return acc * (b.odds || 1); }, 1);
            var stake = parseFloat(document.getElementById('stake').value) || 0;
            document.getElementById('totalOdds').innerText = selected.length > 0 ? total.toFixed(2) : "1.00";
            document.getElementById('potentialWin').innerText = (selected.length > 0 ? (total * stake).toFixed(2) : "0.00") + " €";
        }
    </script>
</body>
</html>
