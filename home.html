<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bet-Pro Engine</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; border-left: 4px solid #00ffcc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #222; }
        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: left; font-size: 0.9em; }
        th { color: #00ffcc; }
        .btn-add { background: #00ffcc; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; color: #121212; }
        .sidebar { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BET-PRO ENGINE</h1>
        <div id="status" style="color: #00ffcc; margin-bottom: 15px;">Inizializzazione motore...</div>
        <div class="card">
            <table id="betsTable">
                <thead><tr><th>Sport</th><th>Match</th><th>Pick</th><th>Prob %</th><th>Quota</th><th>EV%</th><th>Azioni</th></tr></thead>
                <tbody><tr><td colspan="7" style="text-align:center; color:#888;">Recupero quote in corso...</td></tr></tbody>
            </table>
        </div>
        <div class="sidebar">
            <h3>Schedina</h3>
            <div id="slipItems">Nessuna selezione.</div>
            <p><strong>Totale Quota:</strong> <span id="totalOdds">1.00</span></p>
            <input type="number" id="stake" value="10" oninput="updateCalculation()" style="background:#222; color:#fff; border:1px solid #444; padding:5px; width:80px;"> €
            <p><strong>Vincita:</strong> <span id="potentialWin">0.00</span> €</p>
        </div>
    </div>
    <script>
        // Variabili globali per evitare conflitti
        window.allBets = [];
        window.selected = [];

        async function avviaMotore() {
            const statusEl = document.getElementById('status');
            const tbody = document.querySelector("#betsTable tbody");
            
            try {
                // Il parametro nocache forza il server a dare sempre il file aggiornato
                const response = await fetch('./results.json?nocache=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Impossibile trovare i dati (Errore ${response.status}). Attendi 1 minuto e riprova.`);
                }
                
                const data = await response.json();
                statusEl.innerText = "Ultimo aggiornamento: " + (data.last_update || "Oggi");
                
                window.allBets = data.recommendations || [];
                tbody.innerHTML = "";
                
                if (window.allBets.length > 0) {
                    window.allBets.forEach(b => {
                        tbody.innerHTML += `<tr>
                            <td>${b.sport}</td>
                            <td>${b.match}</td>
                            <td style="font-weight:bold; color:#fff;">${b.pick}</td>
                            <td style="color:#00ffcc;">${b.probability}%</td>
                            <td style="font-weight:bold;">${b.odds}</td>
                            <td style="color:#00ffcc;">+${b.ev}%</td>
                            <td><button class="btn-add" onclick="aggiungiSchedina('${b.id}')">Aggiungi</button></td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#ffcc00;">Nessun evento disponibile al momento.</td></tr>`;
                }
            } catch (error) {
                statusEl.innerText = "ERRORE DI SISTEMA: " + error.message;
                statusEl.style.color = "#ff4444";
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#ff4444;">Dati non disponibili. Controlla le Actions su GitHub.</td></tr>`;
            }
        }

        window.aggiungiSchedina = function(id) {
            if(!window.selected.find(x => x.id === id)) {
                window.selected.push(window.allBets.find(x => x.id === id));
                aggiornaVistaSchedina();
            }
        };

        window.aggiornaVistaSchedina = function() {
            const slipDiv = document.getElementById('slipItems');
            if (window.selected.length === 0) {
                slipDiv.innerHTML = "Nessuna selezione.";
                return;
            }
            slipDiv.innerHTML = window.selected.map(x => `<div style="margin-bottom:8px; background:#333; padding:5px; border-radius:4px;"><strong>${x.match}</strong><br>Pick: ${x.pick} (${x.odds})</div>`).join('');
            updateCalculation();
        };

        window.updateCalculation = function() {
            const total = window.selected.reduce((acc, b) => acc * b.odds, 1);
            const stake = parseFloat(document.getElementById('stake').value) || 0;
            document.getElementById('totalOdds').innerText = total.toFixed(2);
            document.getElementById('potentialWin').innerText = (total * stake).toFixed(2);
        };

        // Lancia il caricamento
        avviaMotore();
    </script>
</body>
</html>
